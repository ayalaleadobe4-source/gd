name: Remote Browser via SSH Tunnel

on:
  workflow_dispatch:

jobs:
  vnc-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y x11vnc xvfb fluxbox chromium-browser
          git clone https://github.com/novnc/noVNC.git noVNC
          git clone https://github.com/novnc/websockify noVNC/utils/websockify

      - name: Start Browser & VNC
        run: |
          # הפעלת המסך הוירטואלי
          Xvfb :1 -screen 0 1920x1080x24 &
          export DISPLAY=:1
          fluxbox &
          x11vnc -display :1 -nopw -forever -bg -listen localhost
          
          # הפעלת noVNC בפורט 8080 בתוך השרת
          ./noVNC/utils/novnc_proxy --vnc localhost:5900 --listen 8080 &
          
          # הפעלת הדפדפן
          chromium-browser --no-sandbox --window-size=1920,1080 &

      - name: Setup SSH Tunnel (tmate)
        uses: mxschmitt/action-tmate@v3
        with:
          # זה ימנע מהתהליך להיסגר מיד
          limit-access-to-actor: false
