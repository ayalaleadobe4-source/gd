name: Remote Browser VNC

on:
  workflow_dispatch: # הפעלה ידנית בלבד

jobs:
  vnc-session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Desktop Environment & NoVNC
        run: |
          sudo apt-get update
          # התקנת שרת תצוגה, מנהל חלונות, דפדפן וכלים נחוצים
          sudo apt-get install -y x11vnc xvfb fluxbox chromium-browser
          
          # התקנת noVNC (הממשק האינטרנטי)
          git clone https://github.com/novnc/noVNC.git noVNC
          git clone https://github.com/novnc/websockify noVNC/utils/websockify

      - name: Install ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install ngrok

      - name: Start Services
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          # 1. הגדרת ngrok
          ngrok config add-authtoken $NGROK_AUTH_TOKEN
          
          # 2. פתיחת מסך וירטואלי (1920x1080)
          Xvfb :1 -screen 0 1920x1080x24 &
          export DISPLAY=:1
          
          # 3. הפעלת מנהל חלונות (כדי שנוכל להזיז חלונות)
          fluxbox &
          
          # 4. הפעלת שרת VNC
          x11vnc -display :1 -nopw -forever -bg -listen localhost -xkb
          
          # 5. הפעלת ה-Bridge שמאפשר גישה דרך דפדפן (noVNC)
          ./noVNC/utils/novnc_proxy --vnc localhost:5900 --listen 8080 &
          
          # 6. יצירת הצינור החוצה דרך ngrok
          ngrok http 8080 --log=stdout > /dev/null &
          
          # 7. הפעלת דפדפן כרום בתוך המסך הוירטואלי
          chromium-browser --no-sandbox --window-size=1920,1080 --start-maximized &

          # הדפסת הקישור להתחברות
          echo "---------------------------------------------------"
          echo "Waiting for ngrok to initialize..."
          sleep 5
          echo "Visit this URL to see your browser:"
          curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'
          echo "---------------------------------------------------"
          
          # השארת השרת רץ למשך 5 שעות (או עד שתעצור את ה-Job)
          sleep 18000
