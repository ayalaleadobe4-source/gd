name: Browser Final No-Loop

on:
  workflow_dispatch:

jobs:
  run-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc fluxbox chromium-browser curl jq
          git clone https://github.com/novnc/noVNC.git noVNC
          git clone https://github.com/novnc/websockify noVNC/utils/websockify
          
          # התקנת קלאודפלייר
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Services
        run: |
          # 1. הגדרת מסך וירטואלי (DISPLAY 0)
          export DISPLAY=:0
          Xvfb :0 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          
          # המתנה קבועה של 10 שניות - בלי לולאות בדיקה
          sleep 10
          
          # 2. הפעלת מנהל חלונות
          fluxbox &
          sleep 3
          
          # 3. הפעלת VNC
          x11vnc -display :0 -nopw -forever -bg -listen localhost -shared -noxfixes -noxdamage -noxrecord &
          sleep 5
          
          # 4. הפעלת noVNC על פורט 8080
          ./noVNC/utils/novnc_proxy --vnc localhost:5900 --listen 8080 &
          sleep 3
          
          # 5. הפעלת דפדפן (עם דגלים למניעת קריסות זיכרון)
          chromium-browser --no-sandbox --disable-dev-shm-usage --window-size=1920,1080 --start-maximized &

          # 6. יצירת הצינור של קלאודפלייר
          cloudflared tunnel --url http://localhost:8080 --metrics localhost:36500 &
          
          echo "Waiting 20 seconds for URL generation..."
          sleep 20
          
          echo "---------------------------------------------------"
          echo "CLICK THE LINK BELOW TO OPEN THE BROWSER:"
          # ניסיון חילוץ הכתובת
          curl -s http://localhost:36500/metrics | grep -o 'https://[^ ]*\.trycloudflare\.com' | head -n 1
          echo "---------------------------------------------------"
          
          # שמירה על השרת דלוק
          sleep 18000
