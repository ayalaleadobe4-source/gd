name: Download URL, Package as EXE and Save to GitHub
on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "Direct file URL to download"
        required: true
        type: string

jobs:
  download-and-package:
    # שינוי לשרת ווינדוס כדי שנוכל לייצר קובץ EXE תקין
    runs-on: windows-latest

    steps:
      - name: Download file from URL
        shell: bash
        run: |
          mkdir -p download
          cd download
          curl -L -O -J "${{ github.event.inputs.file_url }}"
          ls -lh

      - name: Create Self-Extracting EXE (SFX)
        shell: cmd
        run: |
          # שימוש בנתיב המלא של 7-Zip בווינדוס כולל מודול ה-SFX
          "C:\Program Files\7-Zip\7z.exe" a -sfx"C:\Program Files\7-Zip\7z.sfx" Installer.exe .\download\*
          dir Installer.exe

      - name: Upload EXE to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Extractor-EXE
          path: Installer.exe
          retention-days: 7

      - name: Cleanup
        shell: bash
        run: rm -rf download Installer.exe
