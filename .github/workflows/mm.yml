name: Download URL and Upload to Google Drive

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "Direct file URL to download"
        required: true
        type: string

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    env:
      # שינינו את שם המשתנה כדי ש-rclone לא יתבלבל
      RCLONE_SECRET_CONTENT: ${{ secrets.RCLONE_CONFIG }}
    steps:
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Setup rclone config
        shell: bash
        run: |
          set -o errexit -o pipefail -o nounset
          mkdir -p ~/.config/rclone
          # כאן אנחנו מדפיסים את התוכן מהמשתנה החדש אל תוך הקובץ
          printf '%s\n' "$RCLONE_SECRET_CONTENT" > ~/.config/rclone/rclone.conf

      - name: Test rclone remote
        shell: bash
        run: |
          rclone lsd gdrive:

      - name: Download file from URL
        shell: bash
        run: |
          mkdir -p download
          cd download
          curl -L -O -J "${{ github.event.inputs.file_url }}"
          ls -lh

      - name: Upload to Google Drive
        shell: bash
        run: |
          rclone copy download gdrive:GitHubUploads \
            --progress \
            --transfers 8 \
            --checkers 16 \
            --drive-chunk-size 64M

      - name: Cleanup
        shell: bash
        run: rm -rf download
