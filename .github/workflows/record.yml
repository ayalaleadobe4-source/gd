name: Record Website and Convert to GIF

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'הכנס את כתובת האתר'
        required: true

jobs:
  record-and-convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run Playwright Script
        run: node record.js "${{ github.event.inputs.url }}"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Convert WebM to optimized GIF
        run: |
          # מציאת קובץ הוידאו שנוצר
          WEBM_FILE=$(ls videos/*.webm | head -n 1)
          
          # המרה ל-GIF ברוחב 400px עם 10 פריימים בשנייה לטובת דחיסה אופטימלית
          ffmpeg -i "$WEBM_FILE" -vf "fps=10,scale=400:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse" -loop 0 output.gif

      - name: Upload GIF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-scroll-gif
          path: output.gif
